<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Earth Has a Limit | Gallery</title>
  <style>
:root {
  --green: #2f6b3f;
  --dark: #1d3a26;
  --light: #f3f7f2;
  --text: #222;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  line-height: 1.6;
  background: #fff;
}
header {
  background: var(--dark);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
header .brand { font-weight: bold; font-size: 1.1rem; }
nav a {
  color: #fff;
  text-decoration: none;
  margin-left: 16px;
  padding-bottom: 2px;
}
nav a:hover, nav a.active { border-bottom: 2px solid #9ad7a8; }
main { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
.hero {
  background: var(--light);
  text-align: center;
  padding: 48px 20px;
}
.hero h1 { font-size: 2.4rem; margin: 0 0 6px; color: var(--dark); }
.hero .slogan { font-size: 1.3rem; color: var(--green); margin: 0 0 10px; font-weight: bold; }
.hero h2 { margin: 18px 0 8px; font-size: 1rem; letter-spacing: 2px; }
.hero p { max-width: 700px; margin: 10px auto; }
.btn {
  display: inline-block;
  background: var(--green);
  color: #fff;
  padding: 10px 20px;
  margin: 6px;
  text-decoration: none;
  border-radius: 4px;
}
.btn:hover { background: var(--dark); }
h2, h3 { color: var(--dark); }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin: 20px 0;
}
.stat { border: 1px solid #cfdccf; border-radius: 6px; padding: 16px; background: var(--light); }
.stat .num { font-size: 1.8rem; font-weight: bold; color: var(--green); }
.stat .label { font-weight: bold; }
.stat .src { font-size: 0.85rem; color: #555; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.placeholder {
  background: #e6ece5;
  border: 2px dashed #9bb59f;
  padding: 40px 16px;
  text-align: center;
  color: #556;
  margin: 10px 0;
}
form label { display: block; margin-top: 12px; font-weight: bold; }
form input, form textarea { width: 100%; padding: 8px; font: inherit; }
form button { margin-top: 14px; border: 0; cursor: pointer; font: inherit; }
footer {
  background: var(--light);
  border-top: 1px solid #cfdccf;
  text-align: center;
  padding: 16px;
  font-size: 0.9rem;
  color: #444;
}

</style>
</head>
<body>
  <header>
    <span class="brand">The Earth Has a Limit</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="issue.html">About the Issue</a>
      <a href="solutions.html">Solutions</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Multimedia Gallery UGGGHH</h1>


    <h2>Photos</h2>
    <div class="two-col">

    </div>

    <h2>Infographic</h2>

    <h2>Videos</h2>
  </main>

  <footer>The Earth Has a Limit &middot; Empowerment Technologies Project &middot; Upper Bicutan National High School</footer>
</body>
</html>
